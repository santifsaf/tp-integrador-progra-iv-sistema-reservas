name: seat-reservation

services:
  availability-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${AVAILABILITY_DB_NAME:-availability}
      POSTGRES_USER: ${AVAILABILITY_DB_USER:-availability}
      POSTGRES_PASSWORD: ${AVAILABILITY_DB_PASSWORD:-availability}
    ports:
      # Puerto del host (configurable en infra/.env); dentro de la red de Docker siempre es 5432.
      - "${AVAILABILITY_DB_PORT:-5433}:5432"
    volumes:
      - availability-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AVAILABILITY_DB_USER:-availability} -d ${AVAILABILITY_DB_NAME:-availability}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8081"
      KC_HEALTH_ENABLED: "true"
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      AVAILABILITY_CLIENT_SECRET: ${AVAILABILITY_CLIENT_SECRET}
      BOOKING_CLIENT_SECRET: ${BOOKING_CLIENT_SECRET}
      PAYMENT_CLIENT_SECRET: ${PAYMENT_CLIENT_SECRET}
      NOTIFICATIONS_CLIENT_SECRET: ${NOTIFICATIONS_CLIENT_SECRET}
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # La imagen no trae curl: se consulta /health/ready del puerto de management con bash.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s



  booking-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${BOOKING_DB_USER:-booking}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking}
      POSTGRES_DB: ${BOOKING_DB_NAME:-booking}
    ports:
      # Puerto del host (configurable en infra/.env); dentro de la red de Docker siempre es 5432.
      - "${BOOKING_DB_PORT:-5432}:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
      # Crea la base booking_tests (la usa Booking.Data.Tests) la primera vez que se inicia el volumen.
      - ./postgres/booking/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKING_DB_USER:-booking} -d ${BOOKING_DB_NAME:-booking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  availability-api:
    build:
      context: ..
      dockerfile: src/Availability/Availability.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__AvailabilityDb=Host=availability-db;Port=5432;Database=${AVAILABILITY_DB_NAME:-availability};Username=${AVAILABILITY_DB_USER:-availability};Password=${AVAILABILITY_DB_PASSWORD:-availability}
      - JwtSettings__Authority=http://keycloak:8081
      - JwtSettings__Audience=availability-api
      - JwtSettings__RequireHttpsMetadata=false
    ports:
      - "5100:8080"
    depends_on:
      availability-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  booking-db-data:
  availability-db-data:
